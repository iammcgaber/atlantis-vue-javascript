# DigitalOcean App Platform spec for claude/atlantis-vue, a static single-page app.
# Create the app with: doctl apps create --spec claude/atlantis-vue/.do/app.yaml
# Update it later with: doctl apps update <app-id> --spec claude/atlantis-vue/.do/app.yaml
# The repository is private, so App Platform needs access through its GitHub integration.
name: atlantis-vue
region: nyc

static_sites:
  - name: web
    github:
      repo: iammcgaber/ai_sandbox
      branch: main
      deploy_on_push: true
    source_dir: claude/atlantis-vue
    # The Node.js buildpack runs `npm ci` first, using the Node version from package.json "engines".
    build_command: npm run build
    output_dir: dist
    # History-mode router (createWebHistory): every unknown path serves index.html, so deep links and reloads work.
    catchall_document: index.html
    # Build-time variables (VITE_*) are compiled into the bundle and public. Uncomment the ones you use.
    # Never add the dev-only Tolgee credentials (VITE_APP_TOLGEE_*) here.
    # envs:
    #   - key: VITE_AUTH_URL                 # Better Auth server; without it the in-browser mock is used
    #     scope: BUILD_TIME
    #     value: https://api.example.com/api/auth
    #   - key: VITE_FILESTACK_API_KEY        # without it Filestack's shared demo key is used
    #     scope: BUILD_TIME
    #     value: your-api-key
    #   - key: VITE_FLAGSMITH_ENVIRONMENT_ID # without it the flag defaults in src/flags/index.js are used
    #     scope: BUILD_TIME
    #     value: your-environment-id
    #   - key: VITE_TOLGEE_CDN_URL           # published translations layered over the bundled ones
    #     scope: BUILD_TIME
    #     value: https://cdn.tolg.ee/your-content-delivery-id
